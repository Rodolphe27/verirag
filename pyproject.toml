[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verirag"
version = "0.1.0"
description = "Multi-agent RAG assistant that verifies every claim against its sources before answering."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Rodolphe Loic Souassi Tatang" }]
dependencies = [
    "langgraph>=1.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "requests>=2.31",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
