[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verirag"
version = "0.1.0"
description = "Multi-agent RAG assistant that verifies every claim against its sources before answering."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Rodolphe Loic Souassi Tatang" }]
dependencies = [
    "langgraph>=1.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "requests>=2.31",
    "mcp>=1.0",
    "pypdf>=4",
]

[project.scripts]
verirag = "verirag.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: basic errors, I: import order, UP: modern syntax, B: likely bugs, SIM: simplifications
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["verirag", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# Architecture rules, checked by `lint-imports` (and in CI). Arrows point inward:
# adapters may import the core, the core never imports adapters.
[tool.importlinter]
root_package = "verirag"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The domain uses only the standard library"
type = "forbidden"
source_modules = ["verirag.domain"]
forbidden_modules = [
    "verirag.ports", "verirag.agents", "verirag.llm", "verirag.retrieval", "verirag.tracing",
    "verirag.evaluation", "verirag.assistant", "verirag.cli", "verirag.mcp_server",
    "verirag.config", "numpy", "requests", "langgraph", "mcp", "fastembed", "pypdf",
]

[[tool.importlinter.contracts]]
name = "The ports depend on the domain only"
type = "forbidden"
source_modules = ["verirag.ports"]
forbidden_modules = [
    "verirag.agents", "verirag.llm", "verirag.retrieval", "verirag.tracing",
    "verirag.evaluation", "verirag.assistant", "verirag.cli", "verirag.mcp_server",
    "numpy", "requests", "langgraph", "mcp", "fastembed", "pypdf",
]

[[tool.importlinter.contracts]]
name = "The agents know no adapter and no outside library except the graph library"
type = "forbidden"
source_modules = ["verirag.agents"]
forbidden_modules = [
    "verirag.llm", "verirag.retrieval", "verirag.tracing", "verirag.evaluation",
    "verirag.assistant", "verirag.cli", "verirag.mcp_server",
    "numpy", "requests", "mcp", "fastembed", "pypdf",
]

[[tool.importlinter.contracts]]
name = "The adapters do not know each other"
type = "independence"
modules = ["verirag.llm", "verirag.retrieval", "verirag.tracing"]

[[tool.importlinter.contracts]]
name = "The adapters do not know the agents or the interfaces"
type = "forbidden"
source_modules = ["verirag.llm", "verirag.retrieval", "verirag.tracing"]
forbidden_modules = ["verirag.agents", "verirag.assistant", "verirag.cli", "verirag.mcp_server", "verirag.evaluation"]
