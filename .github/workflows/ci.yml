name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the project with its dev tools
        run: pip install -e ".[dev]"
      - name: Style (ruff)
        run: ruff check . && ruff format --check .
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest -q
